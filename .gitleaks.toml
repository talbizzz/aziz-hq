# Default gitleaks rules plus allowances for the repo's own docs and spike records.
[extend]
useDefault = true

[allowlist]
description = "Lockfile hashes and the redaction test fixtures are not secrets"
paths = [
  '''pnpm-lock\.yaml''',
  # intentionally contains fake, secret-shaped values to test redaction (assembled from pieces at runtime where possible)
  '''packages/core/src/redaction/redact\.test\.ts''',
]
